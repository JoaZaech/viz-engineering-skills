<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="The workflow: you ask a question, the agent interviews you and writes the domain doc, abstracts data and task, builds five D3 designs with a decisions record, you rate them, and the agent iterates on the earliest wrong block until you pick one.">
  <title>How a viz-engineering-skills session works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a84"/></marker>
  </defs>
  <rect width="960" height="340" rx="20" fill="#fafaf9" stroke="#e6e5e1"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- lanes -->
    <rect x="16" y="16" width="928" height="140" rx="14" fill="#ffffff" stroke="#e6e5e1"/>
    <rect x="16" y="184" width="928" height="140" rx="14" fill="#f3f2ee" stroke="#e6e5e1"/>
    <text x="36" y="44" font-size="12" font-weight="700" fill="#6b6b66" letter-spacing="1">YOU</text>
    <text x="36" y="212" font-size="12" font-weight="700" fill="#6b6b66" letter-spacing="1">AGENT + SKILLS</text>

    <!-- you -->
    <g font-size="13" fill="#1c1c1a">
      <rect x="36" y="60" width="170" height="78" rx="12" fill="#fff" stroke="#1c1c1a" stroke-width="1.5"/>
      <text x="52" y="86" font-weight="700">① Ask a question</text>
      <text x="52" y="106" fill="#4a4a46">"Which months are best</text><text x="52" y="123" fill="#4a4a46">for our rides? data.csv"</text>

      <rect x="262" y="60" width="170" height="78" rx="12" fill="#fff" stroke="#1c1c1a" stroke-width="1.5"/>
      <text x="278" y="86" font-weight="700">③ Answer a short</text><text x="278" y="104" font-weight="700">interview</text>
      <text x="278" y="124" fill="#4a4a46">or skip it entirely</text>

      <rect x="560" y="60" width="190" height="78" rx="12" fill="#fff" stroke="#1c1c1a" stroke-width="1.5"/>
      <text x="576" y="86" font-weight="700">⑤ Rate the designs</text>
      <text x="576" y="106" fill="#4a4a46">★ Closest · Keep · Drop</text><text x="576" y="123" fill="#4a4a46">+ issue tags, one click each</text>

      <rect x="790" y="60" width="138" height="78" rx="12" fill="#1c1c1a"/>
      <text x="806" y="86" font-weight="700" fill="#fafaf9">⑦ Pick one</text>
      <text x="806" y="106" fill="#c9c7c0">Outcome lands</text><text x="806" y="123" fill="#c9c7c0">in decisions.md</text>
    </g>

    <!-- agent -->
    <g font-size="13" fill="#1c1c1a">
      <rect x="140" y="228" width="196" height="80" rx="12" fill="#fff" stroke="#3f9a5b" stroke-width="2"/>
      <text x="156" y="254" font-weight="700">② viz-domain</text>
      <text x="156" y="274" fill="#4a4a46">who it's for, which questions</text><text x="156" y="291" fill="#6b6b66" font-size="12">→ docs/domain-situation.md</text>

      <rect x="352" y="228" width="222" height="80" rx="12" fill="#fff" stroke="#4a7fb5" stroke-width="2"/>
      <text x="368" y="254" font-weight="700">④ abstract + encode + build</text>
      <text x="368" y="274" fill="#4a4a46">types, {action, target}, marks</text><text x="368" y="291" fill="#6b6b66" font-size="12">→ 5 D3.js designs + decisions.md</text>

      <rect x="664" y="228" width="196" height="80" rx="12" fill="#fff" stroke="#e0a526" stroke-width="2"/>
      <text x="680" y="254" font-weight="700">⑥ viz-iterate</text>
      <text x="680" y="274" fill="#4a4a46">reads your ratings, fixes the</text><text x="680" y="291" fill="#4a4a46">earliest wrong block, rebuilds</text>
    </g>

    <!-- arrows -->
    <g fill="none" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#a)">
      <path d="M150 138 C150 180 200 190 220 226"/>
      <path d="M300 226 C300 190 320 175 330 140"/>
      <path d="M400 140 C410 180 430 195 440 226"/>
      <path d="M574 250 C600 230 615 180 620 140"/>
      <path d="M700 140 C710 180 730 200 740 226"/>
      <path d="M760 228 C740 190 700 170 680 140" stroke-dasharray="4 4"/>
      <path d="M860 250 C880 220 870 170 860 140"/>
    </g>
    <text x="772" y="196" font-size="11" fill="#8a8a84">round 2, 3 …</text>
  </g>
</svg>
